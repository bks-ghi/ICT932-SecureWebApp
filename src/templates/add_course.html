<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course - SecureWebApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="nav-logo">SecureWebApp</div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/courses">Courses</a>
        <a href="/students">Students</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<main class="container">

    <div class="form-card">
        <h1>Add New Course</h1>

        <form method="POST">
            <label>Course Code</label>
            <input type="text" name="course_code" required placeholder="e.g. ICT932" maxlength="20">

            <label>Course Name</label>
            <input type="text" name="course_name" required placeholder="e.g. Security Testing and Assurance" maxlength="100">

            <label>Description</label>
            <textarea name="description" rows="4" placeholder="Brief course description"></textarea>

            <button type="submit" class="btn">Add Course</button>
            <a href="/courses" class="back-link">Back to Courses</a>
        </form>
    </div>

</main>

</body>
</html>
