<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grades - SecureWebApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="nav-logo">🔒 SecureWebApp</div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/students">👨‍🎓 Students</a>
        <a href="/courses">📚 Courses</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <h1>📝 Grades</h1>
    </div>

    <div class="table-card">

        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Course</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody>
                {% for grade in grades %}
                <tr>
                    <td>{{ grade.student }}</td>
                    <td>{{ grade.course }}</td>
                    <td>{{ grade.grade }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3">No grades recorded.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</main>

</body>
</html>
