<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit Logs - SecureWebApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="nav-logo">🔒 SecureWebApp</div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/students">👨‍🎓 Students</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <h1>🔍 Audit Logs</h1>
    </div>

    <div class="table-card">

        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Event</th>
                    <th>User</th>
                </tr>
            </thead>

            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.timestamp }}</td>
                    <td>{{ log.event }}</td>
                    <td>{{ log.user }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3">No audit logs found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</main>

</body>
</html>
