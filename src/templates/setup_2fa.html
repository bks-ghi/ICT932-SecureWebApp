<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup 2FA - SecureWebApp</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body class="auth-page">

<div class="auth-card">

    <h1>🔐 Set Up Two-Factor Authentication</h1>

    <p class="auth-subtitle">
        Scan this QR code using Google Authenticator or Microsoft Authenticator.
    </p>

    <div style="text-align:center; margin:20px 0;">

        <img
            src="data:image/png;base64,{{ qr_code }}"
            alt="QR Code"
            style="width:220px; border-radius:10px;"
        >

    </div>

    <div class="form-group">

        <label>Manual Secret Key</label>

        <input
            type="text"
            value="{{ secret }}"
            readonly
        >

    </div>

    <p class="auth-subtitle">
        After adding the account to your authenticator app,
        continue to login.
    </p>

    <a href="/login" class="btn-primary" style="text-decoration:none; display:block; text-align:center;">
        Continue to Login
    </a>

</div>

</body>

</html>
