<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courses - SecureWebApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="nav-logo">🔒 SecureWebApp</div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/students">👨‍🎓 Students</a>
        <a href="/enroll">📋 Enroll</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <h1>📚 Courses</h1>
        <a href="/courses/add" class="btn">+ Add Course</a>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Course Name</th>
                    <th>Code</th>
                    <th>Description</th>
                </tr>
            </thead>

            <tbody>
                {% for course in courses %}
                <tr>
                    <td>{{ course.id }}</td>
                    <td>{{ course.name }}</td>
                    <td>{{ course.code }}</td>
                    <td>{{ course.description }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4">No courses available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
