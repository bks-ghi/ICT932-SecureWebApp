{% extends "dashboard.html" %}
{% block content %}
<div class="container mt-4" style="max-width:600px">
    <h2>➕ Add New Course</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Course Code *</label>
            <input type="text" name="course_code" class="form-control" required placeholder="e.g. ICT101" maxlength="20">
        </div>
        <div class="mb-3">
            <label class="form-label">Course Name *</label>
            <input type="text" name="course_name" class="form-control" required placeholder="e.g. Introduction to Cybersecurity" maxlength="100">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Brief course description..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Course</button>
        <a href="{{ url_for('students.list_courses') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
