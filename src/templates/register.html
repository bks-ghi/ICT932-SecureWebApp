<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SecureWebApp</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h2 { margin-bottom: 1.5rem; color: #1a1a1a; }
        input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #01696f; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #0c4e54; }
        .alert-error { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; background: #fce4e4; color: #c0392b; }
        .alert-success { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; background: #e4fce4; color: #1a7a1a; }
        .link { text-align: center; margin-top: 1rem; }
        a { color: #01696f; }
        .info { font-size: 0.85rem; color: #666; margin-bottom: 1rem; background: #f8f8f8; padding: 0.75rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 Register</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="alert-{{ cat }}">{{ msg }}</div>
          {% endfor %}
        {% endwith %}
        <div class="info">⚠️ After registering, you must set up Google Authenticator for 2FA.</div>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password (min 8 chars)" required>
            <button type="submit">Register</button>
        </form>
        <div class="link"><a href="/login">Already have an account? Login</a></div>
    </div>
</body>
</html>
